<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuambanoFind - Tafuta Taarifa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        .search-box { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1; padding: 12px; border: 1px solid #ccc;
            border-radius: 8px; outline: none; font-size: 16px;
        }
        input[type="text"]:focus { border-color: #27ae60; }
        button {
            padding: 12px 20px; background-color: #27ae60; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            font-size: 16px; font-weight: bold;
        }
        button:hover { background-color: #219150; }
        #matokeo { margin-top: 20px; font-weight: bold; color: #e67e22; }
    </style>
</head>
<body>
    <div class="container">
        <h1>LuambanoFind</h1>
        <p>Mfumo wa kisasa wa kutafuta taarifa kwa urahisi na haraka.</p>
        <div class="search-box">
            <input type="text" id="tafutaInput" placeholder="Andika neno hapa...">
            <button onclick="tafutaTaarifa()">Tafuta</button>
        </div>
        <div id="matokeo"></div>
    </div>
    <script>
        function tafutaTaarifa() {
            var neno = document.getElementById("tafutaInput").value;
            var eneoLaMatokeo = document.getElementById("matokeo");
            if (neno === "") {
                eneoLaMatokeo.innerHTML = "Tafadhali andika kitu ili utafute.";
                eneoLaMatokeo.style.color = "red";
            } else {
                eneoLaMatokeo.innerHTML = "Inatafuta taarifa za: <b>" + neno + "</b>...";
                eneoLaMatokeo.style.color = "#e67e22";
                setTimeout(function() {
                    eneoLaMatokeo.innerHTML = "Samahani, database bado haijaunganishwa. Hii ni UI pekee.";
                    eneoLaMatokeo.style.color = "#2980b9";
                }, 1500);
            }
        }
    </script>
</body>
              </html>
