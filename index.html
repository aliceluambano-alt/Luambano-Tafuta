<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuambanoFind - Tafuta Kila Kitu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        .logo-icon {
            width: 70px; 
            height: 70px;
            object-fit: contain;
            border-radius: 10px;
        }
        h1 { color: #2c3e50; margin: 0; font-size: 28px; }
        
        p.subtitle { color: #7f8c8d; text-align: center; font-size: 14px; margin-bottom: 20px;}
        
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab-btn {
            flex: 1; padding: 12px 10px; background: none; border: none;
            font-size: 15px; font-weight: bold; cursor: pointer; color: #7f8c8d;
        }
        .tab-btn.active { color: #27ae60; border-bottom: 3px solid #27ae60; }

        .search-area { display: none; }
        .search-area.active { display: block; }

        .search-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        
        select, input[type="text"] {
            padding: 12px; border: 1px solid #ccc;
            border-radius: 8px; font-size: 16px; outline: none;
            background-color: white;
        }
        select:focus, input[type="text"]:focus { border-color: #27ae60; }
        
        button.action-btn {
            padding: 12px 20px; background-color: #27ae60; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            font-size: 16px; font-weight: bold; width: 100%;
        }
        button.action-btn:hover { background-color: #219150; }
        button.action-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        .btn-folder { background-color: #3498db; margin-bottom: 15px;}
        .btn-folder:hover { background-color: #2980b9; }

        #onlineResults, #offlineResults {
            margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;
            max-height: 300px; overflow-y: auto;
        }
        .result-item {
            background: #f9f9f9; padding: 12px; margin-bottom: 8px;
            border-radius: 5px; border-left: 4px solid #27ae60;
            font-size: 14px; word-break: break-all;
        }
        .result-item a { color: #2980b9; text-decoration: none; font-weight: bold; }
        .file-type { font-weight: bold; font-size: 12px;}
        .error { color: #e74c3c; text-align: center; font-weight: bold; }
        .loading { color: #2980b9; text-align: center; font-weight: bold; }
        
        .folder-status {
            font-size: 13px; text-align: center; color: #27ae60; font-weight: bold; margin-bottom: 10px; display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="IMG-20261124-WA4246.jpg" alt="LuambanoFind Logo" class="logo-icon">
            <h1>LuambanoFind</h1>
        </div>
        
        <p class="subtitle">Tafuta picha, video, na taarifa (Mtandaoni & Offline)</p>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('online', this)">Tafuta Mtandaoni</button>
            <button class="tab-btn" onclick="switchTab('offline', this)">Tafuta Kwenye Kifaa</button>
        </div>

        <!-- Tab ya Mtandaoni -->
        <div id="onlineTab" class="search-area active">
            <div class="search-box">
                <input type="text" id="onlineInput" placeholder="Tafuta taarifa (Mfano: Tanzania)...">
                <button class="action-btn" onclick="searchOnline()">Tafuta Mtandaoni</button>
            </div>
            <div id="onlineResults"></div>
        </div>

        <!-- Tab ya Offline (Kwenye Kifaa) -->
        <div id="offlineTab" class="search-area">
            <p style="font-size: 13px; color: #555; text-align: center;">
                <b>Kwanza:</b> Bonyeza kitufe cha bluu kuchagua folda (Mara moja tu). Kisha andika unachotaka.
            </p>
            
            <button id="selectFolderBtn" class="action-btn btn-folder" onclick="chaguaFolda()">📁 Chagua Folda Kwenye Kifaa</button>
            <p id="folderStatus" class="folder-status">Folda imechaguliwa tayari!</p>
            
            <div class="search-box">
                <!-- Hapa ni kichaguzi cha aina -->
                <select id="categorySelect">
                    <option value="zote">Aina Zote za Faili</option>
                    <option value="picha">Picha (.jpg, .png)</option>
                    <option value="video">Video (.mp4, .mkv)</option>
                    <option value="programu">Programu (.exe, .apk)</option>
                    <option value="nyaraka">Nyaraka (.pdf, .docx)</option>
                </select>

                <input type="text" id="offlineInput" placeholder="Andika jina la faili unalotafuta..." disabled>
                
                <button class="action-btn" onclick="searchOffline()" disabled id="offlineSearchBtn">Tafuta Kwenye Kifaa</button>
            </div>
            <div id="offlineResults"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. Kubadilisha Tabs
        // ==========================================
        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.search-area').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabName + 'Tab').classList.add('active');
            btnElement.classList.add('active');
        }

        // ==========================================
        // 2. Kutafuta MTANDAONI (Wikipedia API)
        // ==========================================
        async function searchOnline() {
            const query = document.getElementById('onlineInput').value;
            const resultsDiv = document.getElementById('onlineResults');
            
            if (!query) {
                resultsDiv.innerHTML = '<p class="error">Tafadhali andika kitu cha kutafuta.</p>';
                return;
            }

            resultsDiv.innerHTML = '<p class="loading">Inatafuta mtandaoni...</p>';

            try {
                const response = await fetch(`https://sw.wikipedia.org/w/api.php?action=query&list=search&srsearch=${query}&format=json&origin=*`);
                const data = await response.json();

                resultsDiv.innerHTML = '';
                
                if (data.query.search.length === 0) {
                    resultsDiv.innerHTML = '<p class="error">Hakuna taarifa zilizopatikana.</p>';
                    return;
                }

                data.query.search.forEach(item => {
                    const cleanSnippet = item.snippet.replace(/<[^>]*>?/gm, '');
                    resultsDiv.innerHTML += `
                        <div class="result-item">
                            <b>${item.title}</b><br>
                            <small>${cleanSnippet}...</small><br><br>
                            <a href="https://sw.wikipedia.org/wiki/${item.title}" target="_blank">Soma zaidi &rarr;</a>
                        </div>
                    `;
                });

            } catch (error) {
                resultsDiv.innerHTML = '<p class="error">Hitilafu imetokea. Hakikisha una internet.</p>';
            }
        }

        // ==========================================
        // 3. Kutafuta Kwenye KIFAA (Offline)
        // ==========================================
        let localFiles = []; 
        let folderImechaguliwa = false;

        async function chaguaFolda() {
            const resultsDiv = document.getElementById('offlineResults');
            const statusText = document.getElementById('folderStatus');
            
            if (!window.showDirectoryPicker) {
                resultsDiv.innerHTML = '<p class="error">Browser yako (au simu yako) haitumii teknolojia hii. Tumia Kompyuta na Chrome/Edge.</p>';
                return;
            }

            try {
                const directoryHandle = await window.showDirectoryPicker();
                localFiles = []; 
                resultsDiv.innerHTML = '<p class="loading">Inasoma faili, tafadhali subiri...</p>';
                
                // Inasoma faili zote zilizopo kwenye folda iliyochaguliwa
                for await (const entry of directoryHandle.values()) {
                    if (entry.kind === 'file') {
                        localFiles.push(entry.name);
                    }
                }
                
                folderImechaguliwa = true;
                document.getElementById('folderStatus').style.display = 'block';
                document.getElementById('selectFolderBtn').innerText = "🔄 Badilisha Folda";
                
                resultsDiv.innerHTML = `<p style="color:green; font-weight:bold;">Tayari! Tafuta faili lolote kutoka kwenye folda hii.</p>`;
                
                document.getElementById('offlineInput').disabled = false;
                document.getElementById('offlineSearchBtn').disabled = false;
                document.getElementById('offlineInput').focus();

            } catch (error) {
                resultsDiv.innerHTML = '<p class="error">Umeghairi kuchagua folda.</p>';
            }
        }

        function searchOffline() {
            const query = document.getElementById('offlineInput').value.toLowerCase();
            const category = document.getElementById('categorySelect').value;
            const resultsDiv = document.getElementById('offlineResults');
            resultsDiv.innerHTML = '';

            // Kama mtumiaji hajaandika kitu, onyesha faili zote za aina aliyochagua
            let matchedFiles = localFiles;

            // 1. Chuja kwa Aina (Category)
            if (category !== 'zote') {
                matchedFiles = matchedFiles.filter(fileName => {
                    const ext = fileName.split('.').pop().toLowerCase();
                    if (category === 'picha') return ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
                    if (category === 'video') return ['mp4', 'mkv', 'avi', 'mov'].includes(ext);
                    if (category === 'programu') return ['exe', 'msi', 'apk'].includes(ext);
                    if (category === 'nyaraka') return ['pdf', 'docx', 'txt', 'xls', 'ppt'].includes(ext);
                    return true;
                });
            }

            // 2. Chuja kwa Jina (Text)
            if (query !== "") {
                matchedFiles = matchedFiles.filter(name => name.toLowerCase().includes(query));
            }

            // 3. Onyesha Matokeo
            if (matchedFiles.length === 0) {
                resultsDiv.innerHTML = `<p class="error">Hakuna faili lililopatikana.</p>`;
                return;
            }

            // Onyesha tu faili 100 za kwanza ili kuepuka kusumbua simu
            const displayLimit = 100; 
            const filesToShow = matchedFiles.slice(0, displayLimit);

            filesToShow.forEach(fileName => {
                const ext = fileName.split('.').pop().toLowerCase();
                let aina = "Faili";
                let color = "#3498db";

                if (['jpg', 'jpeg', 'png', 'gif'].includes(ext)) { aina = "Picha"; color = "#e67e22"; }
                else if (['mp4', 'mkv', 'avi'].includes(ext)) { aina = "Video"; color = "#e74c3c"; }
                else if (['exe', 'msi', 'apk'].includes(ext)) { aina = "Programu"; color = "#9b59b6"; }
                else if (['mp3', 'wav'].includes(ext)) { aina = "Nyimbo"; color = "#2ecc71"; }
                else if (['pdf', 'docx', 'txt'].includes(ext)) { aina = "Nyaraka"; color = "#34495e"; }

                resultsDiv.innerHTML += `
                    <div class="result-item">
                        <b>${fileName}</b> <br>
                        <span class="file-type" style="color:${color}">[${aina}]</span>
                    </div>
                `;
            });

            if (matchedFiles.length > displayLimit) {
                resultsDiv.innerHTML += `<p style="text-align:center; font-size:12px; color:#777;">Kuna faili zingine ${matchedFiles.length - displayLimit} ambazo hazijaonyeshwa. Andika jina mahususi zaidi.</p>`;
            }
        }
    </script>
</body>
    </html>
